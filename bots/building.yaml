# Practical AI Assistants — Будівельний помічник (пріоритет №1).
# Безкоштовний демо-асистент. НЕ представляє конкретний магазин.
name: building_assistant
token_env: BUILDING_BOT_TOKEN

# 1. Assistant Profile
assistant_profile:
  version: 1
  series_name: "Practical AI Assistants"
  assistant_role: "AI-помічник для планування ремонту"
  industry: "будівництво та ремонт"
  target_user: "власники житла та майстри"
  language: uk
  tone: friendly
  disclaimer: "Безкоштовний демонстраційний AI-асистент. Не представляє конкретну компанію чи магазин."
  developer_note: "Потрібен подібний асистент для бізнесу? Це демонстрація можливостей розробки чат-ботів."

# 2. Conversation Flows
conversation_flows:
  version: 1
  menu_title: "Що плануєте зробити?"
  cancel_commands: ["/cancel", "скасувати"]
  flows:
    - id: estimate
      title: "Розрахувати матеріали"
      start: ask_work
      steps:
        - id: ask_work
          kind: question
          text: "Який вид робіт?"
          question_type: choice
          options: ["Штукатурка", "Шпаклівка", "Фарбування", "Плитка"]
          save_as: work
          next: ask_room
        - id: ask_room
          kind: question
          text: "Розміри кімнати (ШxД), напр. 4x5:"
          question_type: dimension
          unit: "м"
          save_as: room
          next: ask_height
        - id: ask_height
          kind: question
          text: "Висота стін (м)?"
          question_type: number
          unit: "м"
          min: 2
          max: 5
          save_as: height
          next: do_calc
        - id: do_calc
          kind: capability
          capability: calculate_materials
          next: make_list
        - id: make_list
          kind: capability
          capability: shopping_list
          next: give_result
        - id: give_result
          kind: capability
          capability: prepare_request
          next: done
        - id: done
          kind: message
          text: "Готово! Це ваш список покупок — візьміть його в будь-який магазин."
    - id: ask_question
      title: "Поставити запитання"
      start: free_q
      steps:
        - id: free_q
          kind: message
          text: "Запитайте що завгодно про матеріали чи етапи робіт."

# 3. Capabilities
capabilities:
  version: 1
  enabled:
    - name: calculate_materials
    - name: search_products
    - name: shopping_list
    - name: compare_options
    - name: prepare_request

# 4. Knowledge & Data
knowledge:
  version: 1
  # Матриця реальних цін (наповнює скрейпер). Кожна ціна — з магазином-джерелом.
  sheets:
    enabled: true
    sheet_id_env: BUILDING_SHEET_ID
    worksheet: "Матеріали"
    cache_ttl_seconds: 300
  calculation_rules:
    # Загальні
    - { id: wall_area,   label: "Площа стін",    expression: "(room_width + room_length) * 2 * height", unit: "м²", round_to: 1 }
    - { id: floor_area,  label: "Площа підлоги", expression: "room_width * room_length",                unit: "м²", round_to: 1 }
    # Штукатурка
    - { id: plaster_kg,  label: "Штукатурка",    expression: "wall_area * norms_plaster",  unit: "кг", round_to: 0 }
    - { id: primer_l,    label: "Ґрунтовка",     expression: "wall_area * norms_primer",   unit: "л",  round_to: 1 }
    # Шпаклівка
    - { id: putty_kg,    label: "Шпаклівка",     expression: "wall_area * norms_putty",    unit: "кг", round_to: 0 }
    # Фарбування
    - { id: paint_l,     label: "Фарба",          expression: "wall_area * norms_paint",    unit: "л",  round_to: 1 }
    # Плитка
    - { id: tile_m2,     label: "Плитка",         expression: "floor_area * norms_tile_waste", unit: "м²", round_to: 1 }
    - { id: tile_glue_kg,label: "Клей для плитки",expression: "floor_area * norms_tile_glue",  unit: "кг", round_to: 0 }
    - { id: grout_kg,    label: "Затирка швів",   expression: "floor_area * norms_grout",      unit: "кг", round_to: 1 }
  norms:
    norms_plaster: 8.5
    norms_primer: 0.15
    norms_putty: 1.2
    norms_paint: 0.25
    norms_tile_waste: 1.1
    norms_tile_glue: 5.0
    norms_grout: 0.3
  work_rules:
    штукатурка: [wall_area, plaster_kg, primer_l]
    шпаклівка: [wall_area, putty_kg, primer_l]
    фарбування: [wall_area, paint_l, primer_l]
    плитка: [floor_area, tile_m2, tile_glue_kg, grout_kg]
  # catalog — локальний резерв, якщо Google Sheets недоступний (шаблон):
  # catalog:
  #   - { category: "Фарба", item: "Інтер'єрна біла 10л", price: 450, unit: "грн",
  #       source_name: "Епіцентр", source_url: "https://...", collected_at: "2026-10", active: true }
  faq:
    - question: "Скільки сохне штукатурка?"
      answer: "Залежно від шару та вологості — зазвичай від 1 до 2 діб."
      keywords: ["сохне", "висихання", "сохнути"]
    - question: "Чи потрібна ґрунтовка перед фарбуванням?"
      answer: "Так, ґрунтовка покращує адгезію та зменшує витрати фарби."
      keywords: ["ґрунтовка", "грунт", "перед фарбуванням"]

# 5. AI Policy
ai_policy:
  version: 1
  enabled: true
  model: claude-opus-4.7
  max_tokens: 700
  clarify_when_unsure: true
  allowed_tools: ["calculate_materials", "search_products", "shopping_list", "compare_options"]
  forbidden_advice: []
  system_prompt: |
    Ти — безкоштовний AI-помічник для планування ремонту. Ти НЕ представляєш
    конкретний магазин чи майстра. Допомагай людям порахувати матеріали й
    підготуватися до покупки та розмови з майстром.
    Кількість матеріалів бери ЛИШЕ з результату calculate_materials.
    Ціни бери ЛИШЕ з матриці (search_products) і ЗАВЖДИ називай разом із магазином-
    джерелом і датою (напр. «фарба — 450 грн, Епіцентр, 10.2026»). Ніколи не вигадуй
    цін чи магазинів. Якщо даних немає — чесно скажи. У кінці допоможи сформувати
    список покупок, який користувач візьме в будь-який магазин.

# 6. Integrations
integrations:
  version: 1
  deliver_to_user: true
  # Збираємо лише дані, потрібні для роботи бота (data minimization).
  # Персональні контакти не запитуємо. Додати поле за потреби (шаблон):
  # request_form:
  #   - { id: name, label: "Ваше ім'я (необов'язково)", type: text, required: false }
  request_form: []
  sinks:
    - type: telegram_manager
      enabled: false
      config: { chat_id_env: BUILDING_MANAGER_CHAT_ID }

# 7. Booking — демо-запис (ВИМКНЕНО для цього бота; шаблон).
# Фіча спільна; щоб увімкнути демо-запис на консультацію/замір — розкоментуй і постав enabled: true.
