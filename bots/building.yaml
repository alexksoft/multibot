# Practical AI Assistants — Будівельний помічник (пріоритет №1).
# Безкоштовний демо-асистент. НЕ представляє конкретний магазин.
name: building_assistant
token_env: BUILDING_BOT_TOKEN

# 1. Assistant Profile
assistant_profile:
  version: 1
  series_name: "Practical AI Assistants"
  assistant_role: "🏠 Тут допомагають із ремонтом"
  industry: "будівництво та ремонт"
  target_user: "власники житла та майстри"
  language: uk
  tone: friendly
  disclaimer: "🤝 Запитуй що завгодно — я не кусаюсь і не намагаюся впарити тобі найдорожчу грунтовку. Все безкоштовно, просто і по справі."
  developer_note: "Потрібен подібний асистент для бізнесу? Це демонстрація можливостей розробки чат-ботів."

# 2. Conversation Flows
conversation_flows:
  version: 1
  menu_title: "Чим допомогти?"
  cancel_commands: ["/cancel", "скасувати"]
  flows:
    - id: estimate
      title: "📏 Порахувати, скільки треба"
      start: ask_work
      steps:
        - id: ask_work
          kind: question
          text: "Який вид робіт?"
          question_type: choice
          options: ["Штукатурка", "Шпаклівка", "Фарбування", "Плитка", "Стяжка підлоги", "Ламінат", "Поклейка шпалер"]
          save_as: work
          transitions:
            - { when: "work == 'плитка'", goto: ask_tile_surface }
          next: ask_price_tier
        - id: ask_tile_surface
          kind: question
          text: "Де укладаєте плитку?"
          question_type: choice
          options: ["Підлога", "Стіни", "Підлога і стіни"]
          save_as: tile_surface
          next: ask_price_tier
        - id: ask_price_tier
          kind: question
          text: "Який ціновий сегмент матеріалів?"
          question_type: choice
          options: ["Економ", "Середній", "Преміум"]
          save_as: price_tier
          next: ask_room
        - id: ask_room
          kind: question
          text: "Розміри кімнати (ШxД):"
          question_type: dimension
          unit: "м"
          suggestions:
            - "3x3"
            - "3x4"
            - "4x4"
            - "4x5"
            - "3x5"
            - "5x5"
            - "3x6"
            - "6x4"
          save_as: room
          transitions:
            - { when: "work == 'плитка' and tile_surface == 'підлога'", goto: do_calc }
            - { when: "work == 'плитка' and tile_surface == 'підлога і стіни'", goto: ask_height }
            - { when: "work == 'плитка' and tile_surface == 'стіни'", goto: ask_height }
            - { when: "work == 'стяжка підлоги'",  goto: do_calc }
            - { when: "work == 'ламінат'",          goto: do_calc }
          next: ask_height
        - id: ask_height
          kind: question
          text: "Висота стін (м)?"
          question_type: number
          unit: "м"
          min: 1.8
          suggestions:
            - "2.5"
            - "2.7"
            - "2.8"
            - "3.0"
          save_as: height
          next: do_calc
        - id: do_calc
          kind: capability
          capability: calculate_materials
          next: make_list
        - id: make_list
          kind: capability
          capability: shopping_list
          next: give_result
        - id: give_result
          kind: capability
          capability: prepare_request
          next: done
        - id: done
          kind: message
          text: "Готово! Це ваш список покупок — візьміть його в будь-який магазин.\n👇 Натисніть кнопку нижче, щоб проконсультуватися з експертом:"
    - id: ask_question
      title: "❓ Задати питання"
      start: free_q
      steps:
        - id: free_q
          kind: message
          text: "Запитайте що завгодно про матеріали чи етапи робіт."

# 3. Capabilities
capabilities:
  version: 1
  enabled:
    - name: calculate_materials
    - name: search_products
    - name: shopping_list
    - name: compare_options
    - name: prepare_request

# 4. Knowledge & Data
knowledge:
  version: 1
  sheets:
    enabled: true
    sheet_id_env: BUILDING_SHEET_ID
    worksheet: "building_assistant_prices"
    cache_ttl_seconds: 300
  calculation_rules:
    - { id: wall_area,    label: "Площа стін",      expression: "(room_width + room_length) * 2 * height", unit: "м²", round_to: 1 }
    - { id: floor_area,   label: "Площа підлоги",   expression: "room_width * room_length",                unit: "м²", round_to: 1 }
    - { id: plaster_kg,   label: "Штукатурка",    expression: "wall_area * norms_plaster * (thickness / 10)", unit: "кг", round_to: 0 }
    - { id: primer_l,     label: "Ґрунтовка",      expression: "wall_area * norms_primer",                unit: "л",  round_to: 1 }
    - { id: putty_kg,     label: "Шпаклівка",      expression: "wall_area * norms_putty * (thickness / 2)",  unit: "кг", round_to: 0 }
    - { id: paint_l,      label: "Фарба",           expression: "wall_area * norms_paint",                 unit: "л",  round_to: 1 }
    - { id: tile_m2,      label: "Плитка (підлога)",   expression: "floor_area * norms_tile_waste",           unit: "м²", round_to: 1 }
    - { id: tile_glue_kg, label: "Клей (підлога)",     expression: "floor_area * norms_tile_glue",            unit: "кг", round_to: 0 }
    - { id: grout_kg,     label: "Затирка",          expression: "floor_area * norms_grout",               unit: "кг", round_to: 1 }
    - { id: tile_wall_m2,      label: "Плитка (стіни)",   expression: "wall_area * norms_tile_waste",           unit: "м²", round_to: 1 }
    - { id: tile_wall_glue_kg, label: "Клей (стіни)",     expression: "wall_area * norms_tile_glue",            unit: "кг", round_to: 0 }
    - { id: grout_wall_kg,     label: "Затирка (стіни)",  expression: "wall_area * norms_grout",               unit: "кг", round_to: 1 }
    - { id: screed_kg,    label: "Цементна стяжка", expression: "floor_area * norms_screed * (thickness / 10)", unit: "кг", round_to: 0 }
    - { id: screed_fiber, label: "Фібра",            expression: "floor_area * (thickness / 1000) * norms_fiber", unit: "кг", round_to: 2 }
    - { id: lam_m2,       label: "Ламінат",          expression: "floor_area * norms_lam_waste", unit: "м²", round_to: 1 }
    - { id: lam_sub_m2,   label: "Підкладка",        expression: "floor_area * norms_lam_waste", unit: "м²", round_to: 1 }
    - { id: wallpaper_rl,  label: "Шпалери",         expression: "wall_area", unit: "м²", round_to: 1 }
    - { id: wallpaper_glue, label: "Клей для шпалер", expression: "wall_area", unit: "м²", round_to: 1 }
  norms:
    norms_plaster: 15.5
    norms_primer: 0.15
    norms_putty: 1.2
    norms_paint: 0.25
    norms_tile_waste: 1.1
    norms_tile_glue: 5.0
    norms_grout: 0.3
    norms_screed: 20.0
    norms_fiber: 0.75
    norms_lam_waste: 1.1
    norms_wallpaper_roll: 5.0
    norms_wallpaper_glue: 15.0
  work_rules:
    штукатурка: [wall_area, plaster_kg, primer_l]
    шпаклівка: [wall_area, putty_kg, primer_l]
    фарбування: [wall_area, paint_l, primer_l]
    плитка: [floor_area, tile_m2, tile_glue_kg, grout_kg]
    підлога: [floor_area, tile_m2, tile_glue_kg, grout_kg]
    стіни: [wall_area, tile_wall_m2, tile_wall_glue_kg, grout_wall_kg]
    підлога і стіни: [floor_area, wall_area, tile_m2, tile_glue_kg, grout_kg, tile_wall_m2, tile_wall_glue_kg, grout_wall_kg]
    стяжка підлоги: [floor_area, screed_kg, screed_fiber]
    ламінат: [floor_area, lam_m2, lam_sub_m2]
    поклейка шпалер: [wall_area, wallpaper_rl, wallpaper_glue]
  faq: []

# 5. AI Policy
ai_policy:
  version: 1
  enabled: true
  fallback_message: "Вибачте, будь ласка, але мені не вдалося знайти точну відповідь на ваше запитання. Спробуйте перефразувати його або вказати більше деталей."
  model: openai/gpt-oss-20b
  max_tokens: 2000
  clarify_when_unsure: true
  allowed_tools: ["calculate_materials", "search_products", "shopping_list", "compare_options"]
  forbidden_advice: []
  system_prompt: |
    Ти — незалежний український будівельний експерт. Твоє завдання — аналізувати розрахунки матеріалів та давати сухі, практичні поради.

    ЛОГІКА ВІДПОВІДІ:
    1. Якщо надіслано ГОТОВИЙ РОЗРАХУНОК: Проаналізуй об'єми та матеріали. Дай поради щодо вибору інструментів (до 4-5 штук), етапів робіт (до 4 кроків) та типових помилок (до 3-4 пунктів). Запропонуй вигідніші альтернативи матеріалів, якщо це доречно.
    2. Якщо просять РОЗРАХУВАТИ з нуля: НЕ рахуй і НЕ питай дані. В 1-2 реченнях запропонуй скористатися кнопкою «Розрахувати матеріали».
    3. На загальні питання: Відповідай коротко і по суті. Ціни не вигадуй. Ніяких "не знаю/не вмію".
    
    СУВОРІ ПРАВИЛА СТИЛЮ ТА МОВИ:
    - ПОВНА ЗНЕОСОБЛЕНІСТЬ: Категорично заборонено звертатися на "ти" або "ви" ("маєте", "ви обрали", "ваші розрахунки"). Пиши нейтрально: "Розрахунок є реалістичним", "Вказана цифра є робочою", "Матеріал наноситься".
    - ЖОДНИХ ПРЕАМБУЛ: Одразу починай аналіз із суті, без привітань чи побажань успіху.
    - ЛІМІТ ОБСЯГУ: Фінальний текст має бути максимально коротким і тезовим (до 1500–2000 символів). 
    - БУДІВЕЛЬНИЙ ФІЛЬТР: Пиши живою мовою з природним будівельним сленгом (клей впритул, підрізка, правило, рівень), але категорично заборонено вигадувати слова чи копіювати русизми.
    * ЗАБОРОНЕНО: упаківок, ребродер, колба, каска, прыгнут, під косяк, будь-which, келишки, ролик, різнобегает, цимки, від півниці.
    * ДОЗВОЛЕНО: упаковок, плиткоріз, відро, малярна кюветка, валик, підтікання, наждачний папір, від підлоги, підрізка, зміщення.# 6. Integrations
integrations:
  version: 1
  deliver_to_user: true
  request_form: []
  sinks:
    - type: telegram_manager
      enabled: false
      config: { chat_id_env: BUILDING_MANAGER_CHAT_ID }
