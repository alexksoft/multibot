# Practical AI Assistants — Windows & Doors Assistant (пріоритет №4).
name: windows_assistant
token_env: WINDOWS_BOT_TOKEN

# 1. Assistant Profile
assistant_profile:
  version: 1
  series_name: "Practical AI Assistants"
  assistant_role: "AI-помічник для вибору вікон і дверей"
  industry: "вікна та двері"
  target_user: "хто планує заміну вікон або дверей"
  language: uk
  tone: friendly
  disclaimer: "Безкоштовний демонстраційний AI-асистент. Не представляє конкретну компанію чи продавця."
  developer_note: "Потрібен подібний асистент для бізнесу? Це демонстрація можливостей розробки чат-ботів."

# 2. Conversation Flows
conversation_flows:
  version: 1
  menu_title: "Чим допомогти?"
  cancel_commands: ["/cancel", "скасувати"]
  flows:
    - id: select
      title: "Підібрати та підготувати заявку"
      start: ask_size
      steps:
        - id: ask_size
          kind: question
          text: "Розміри отвору ШxВ (см), напр. 140x120:"
          question_type: dimension
          unit: "см"
          save_as: size
          next: ask_chambers
        - id: ask_chambers
          kind: question
          text: "Який склопакет?"
          question_type: choice
          options: ["Однокамерний", "Двокамерний", "Енергозберігаючий"]
          save_as: chambers
          next: ask_side
        - id: ask_side
          kind: question
          text: "На яку сторону виходить вікно?"
          question_type: choice
          options: ["Сонячна", "Тіньова", "Не знаю"]
          save_as: side
          next: do_calc
        - id: do_calc
          kind: capability
          capability: calculate_materials
          next: compare
        - id: compare
          kind: capability
          capability: compare_options
          next: measure_cl
        - id: measure_cl
          kind: capability
          capability: checklist
          next: make_request
        - id: make_request
          kind: capability
          capability: prepare_request
          next: done
        - id: done
          kind: message
          text: "Готова заявка з параметрами — передайте її будь-якому продавцю для прорахунку."

# 3. Capabilities
capabilities:
  version: 1
  enabled:
    - name: calculate_materials
    - name: search_products
    - name: compare_options
    - name: checklist
    - name: prepare_request

# 4. Knowledge & Data
knowledge:
  version: 1
  sheets:
    enabled: true
    sheet_id_env: WINDOWS_SHEET_ID
    worksheet: "windows_assistant_prices"
    cache_ttl_seconds: 300
  calculation_rules:
    - { id: area, label: "Площа вікна", expression: "(size_width / 100) * (size_height / 100)", unit: "м²", round_to: 2 }
  norms: {}
  work_rules: {}
  faq:
    - question: "Який склопакет кращий для сонячної сторони?"
      answer: "Для сонячної сторони варто розглянути енергозберігаючий склопакет із захистом від перегріву."
      keywords: ["склопакет", "сонячна", "який обрати"]
    - question: "Що важливо виміряти перед замовленням?"
      answer: "Ширину й висоту отвору, товщину стіни, бік відкривання та поверх."
      keywords: ["заміри", "виміряти", "перед замовленням"]

# 5. AI Policy
ai_policy:
  version: 1
  enabled: true
  model: claude-sonnet-4-5
  max_tokens: 400
  clarify_when_unsure: true
  allowed_tools: ["calculate_materials", "search_products", "compare_options"]
  forbidden_advice: []
  system_prompt: |
    Ти — безкоштовний AI-помічник для вибору вікон і дверей. Ти НЕ представляєш конкретну компанію.
    ВАЖЛИВО: якщо користувач хоче підібрати вікно або дізнатися ціни — НЕ питай деталі сам.
    Запропонуй скористатися пунктом меню "Підібрати та підготувати заявку" — там бот проведе крок за кроком.
    На загальні запитання про вікна — відповідай коротко і по суті.
    Остаточну ціну визначає продавець після заміру — не вигадуй сум.

# 6. Integrations
integrations:
  version: 1
  deliver_to_user: true
  request_form: []
  sinks:
    - type: telegram_manager
      enabled: false
      config: { chat_id_env: WINDOWS_MANAGER_CHAT_ID }
