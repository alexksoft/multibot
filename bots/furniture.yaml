# Practical AI Assistants — Furniture & Interior Assistant (пріоритет №2).
name: furniture_assistant
token_env: FURNITURE_BOT_TOKEN

# 1. Assistant Profile
assistant_profile:
  version: 1
  series_name: "Practical AI Assistants"
  assistant_role: "AI-помічник для планування меблів і ремонту кімнати"
  industry: "меблі та інтер'єр"
  target_user: "хто планує кухню, шафу або ремонт кімнати"
  language: uk
  tone: friendly
  disclaimer: "Безкоштовний демонстраційний AI-асистент. Не представляє конкретну компанію чи майстерню."
  developer_note: "Потрібен подібний асистент для бізнесу? Це демонстрація можливостей розробки чат-ботів."

# 2. Conversation Flows
conversation_flows:
  version: 1
  menu_title: "Що робимо?"
  cancel_commands: ["/cancel", "скасувати"]
  flows:
    - id: brief
      title: "Зібрати вимоги та ТЗ"
      start: ask_product
      steps:
        - id: ask_product
          kind: question
          text: "Що плануєте?"
          question_type: choice
          options: ["Кухня", "Шафа-купе", "Інше"]
          save_as: product
          next: ask_length
        - id: ask_length
          kind: question
          text: "Орієнтовна довжина виробу (м)?"
          question_type: number
          unit: "м"
          min: 0.5
          max: 10
          save_as: length
          next: ask_budget
        - id: ask_budget
          kind: question
          text: "Орієнтовний бюджет (грн)?"
          question_type: number
          save_as: budget
          next: ask_layout
        - id: ask_layout
          kind: question
          text: "Яка конфігурація?"
          question_type: choice
          options: ["Пряма", "Кутова", "П-подібна"]
          save_as: layout
          next: measure_checklist
        - id: measure_checklist
          kind: capability
          capability: checklist
          params: { template: furniture_measure }
          next: make_spec
        - id: make_spec
          kind: capability
          capability: prepare_request
          next: done
        - id: done
          kind: message
          text: "Готове ТЗ для мебляра — надішліть його будь-якому обраному майстру."
    - id: checklist_only
      title: "Чекліст замірів"
      start: cl
      steps:
        - id: cl
          kind: capability
          capability: checklist
          params: { template: furniture_measure }

# 3. Capabilities
capabilities:
  version: 1
  enabled:
    - name: checklist
    - name: questions_for_pro
    - name: prepare_request

# 4. Knowledge & Data
knowledge:
  version: 1
  sheets:
    enabled: true
    sheet_id_env: FURNITURE_SHEET_ID
    worksheet: "furniture_assistant_prices"
    cache_ttl_seconds: 300
  calculation_rules: []
  norms: {}
  work_rules: {}
  faq:
    - question: "Скільки виготовляється кухня?"
      answer: "Зазвичай від 3 до 5 тижнів після затвердження проєкту (орієнтовно за ринком)."
      keywords: ["термін", "виготовляється", "скільки чекати"]
    - question: "Що важливо вказати в ТЗ?"
      answer: "Розміри, конфігурацію, матеріал фасадів, колір, фурнітуру та потрібну техніку."
      keywords: ["тз", "технічне завдання", "що вказати"]

# 5. AI Policy
ai_policy:
  version: 1
  enabled: true
  model: claude-sonnet-4-5
  max_tokens: 400
  clarify_when_unsure: true
  allowed_tools: ["checklist", "questions_for_pro"]
  forbidden_advice: []
  system_prompt: |
    Ти — безкоштовний AI-помічник для планування меблів. Ти НЕ представляєш конкретну майстерню.
    ВАЖЛИВО: якщо користувач хоче зібрати вимоги або скласти ТЗ — НЕ питай деталі сам.
    Запропонуй скористатися пунктом меню "Зібрати вимоги та ТЗ" — там бот проведе крок за кроком.
    На загальні запитання про меблі — відповідай коротко і по суті.
    Точних цін виробів не називай — вони залежать від майстерні.

# 6. Integrations
integrations:
  version: 1
  deliver_to_user: true
  # Збираємо лише дані, потрібні для роботи бота (data minimization).
  # Персональні контакти не запитуємо. Додати поле за потреби (шаблон):
  # request_form:
  #   - { id: name, label: "Ваше ім'я (необов'язково)", type: text, required: false }
  request_form: []
  sinks:
    - type: telegram_manager
      enabled: false
      config: { chat_id_env: FURNITURE_MANAGER_CHAT_ID }

# 7. Booking — демо-запис (ВИМКНЕНО для цього бота; шаблон).
# Фіча спільна; щоб увімкнути демо-запис на замір/консультацію — розкоментуй і постав enabled: true.
