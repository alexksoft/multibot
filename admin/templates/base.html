<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Multibot Admin{% endblock %}</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; }
  nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #ccc; padding-bottom: 0.5rem; }
  nav a { text-decoration: none; color: #0066cc; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; }
  .badge-ok { background: #d4edda; color: #155724; }
  .badge-off { background: #f8d7da; color: #721c24; }
  .badge-warn { background: #fff3cd; color: #856404; }
  pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; border-radius: 4px; }
  .error { color: #721c24; background: #f8d7da; padding: 0.5rem; border-radius: 4px; }
  input, select, textarea { width: 100%; padding: 0.4rem; margin: 0.3rem 0 0.8rem; box-sizing: border-box; }
  button, input[type=submit] { padding: 0.5rem 1.2rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
{% block nav %}
<nav>
  <a href="/">🤖 Боти</a>
  <a href="/scraper">🕷️ Скрейпер</a>
  <a href="/facebook">📘 Facebook</a>
  <a href="/new">➕ Новий бот</a>
  <form method="post" action="/logout" style="margin:0"><button style="background:none;color:#666;padding:0">Вийти</button></form>
</nav>
{% endblock %}
{% block content %}{% endblock %}
</body>
</html>
